[project]
name = "wingman-api"
version = "0.1.0"
description = "Wingman backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "structlog",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "redis",
  "arq",
  "httpx",
  "anthropic>=2.3",
  "openai>=3.42",
  "jinja2>=3.1",
  "pyyaml>=6",
  "sentry-sdk[fastapi]>=2.73.0",
  "pyjwt[crypto]>=2.15.1",
  "google-auth>=2.62.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20261030",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
