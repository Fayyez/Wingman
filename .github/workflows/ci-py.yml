name: ci-py
on:
  push:
  pull_request:

jobs:
  py:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman
          POSTGRES_DB: wingman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingman -d wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wingman:wingman@localhost:5432/wingman_test
